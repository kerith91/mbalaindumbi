<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Achat nouvelle voiture</title>
</head>

<body bgcolor="blue">

    <h1 align="center">
        <font color="yellow" size="7">
            Achat nouvelle voiture
        </font>
    </h1>

    <br><br>

    <table
        align="center"
        width="630"
        bgcolor="red"
        cellpadding="8"
        cellspacing="0"
        border="0"
    >

        
        <tr>
            <td width="250" align="right">
                <font size="5">Marque :</font>
            </td>

            <td>
                <select>
                    <option>Toyota</option>
                    <option>Ferrari</option>
                    <option>BYD</option>
                    <option>BMW</option>
                    <option>Mercedes</option>
                </select>
            </td>
        </tr>


       
        <tr>
            <td align="right">
                <font size="5">Immatriculation :</font>
            </td>

            <td>
                <input
                    type="text"
                    size="25"
                    
                >
            </td>
        </tr>


        <tr>
            <td align="right">
                <font size="5">Couleur :</font>
            </td>

            <td>
                <input
                    type="text"
                    size="25"
                   
                >
            </td>
        </tr>


        <tr>
            <td align="right">
                <font size="5">
                    Date<br>
                    d'immatriculation<br>
                    :
                </font>
            </td>

            <td>
                <input type="date">
            </td>
        </tr>


       
        <tr>
            <td align="right">
                <font size="5">Kilométrage :</font>
            </td>

            <td>
                <input type="number" size="25">
            </td>
        </tr>


   
        <tr>
            <td align="right">
                <font size="5">État :</font>
            </td>

            <td>
                <font size="5">
                    <input type="radio" name="etat">
                    Occasion

                    &nbsp;&nbsp;

                    <input type="radio" name="etat">
                    Neuf
                </font>
            </td>
        </tr>


        <tr>
            <td align="right">
                <font size="5">Carburant :</font>
            </td>

            <td>
                <font size="5">

                    <input type="radio" name="carburant">
                    Diesel

                    &nbsp;&nbsp;

                    <input type="radio" name="carburant">
                    Électrique

                    <br>

                    <input type="radio" name="carburant">
                    Hybride

                    &nbsp;&nbsp;&nbsp;

                    <input type="radio" name="carburant">
                    Essence

                </font>
            </td>
        </tr>


        
        <tr>
            <td align="right">
                <font size="5">
                    Boîte de vitesse<br>
                    :
                </font>
            </td>

            <td>
                <select>
                    <option>Manuelle</option>
                    <option>Automatique</option>
                </select>
            </td>
        </tr>


        <tr>
            <td align="right">
                <font size="5">
                    Nombre de<br>
                    porte:
                </font>
            </td>

            <td>
                <input type="number" size="25">
            </td>
        </tr>


        
        <tr>
            <td align="right">
                <font size="5">Radio :</font>
            </td>

            <td>
                <font size="5">

                    <input type="radio" name="radio">
                    Oui

                    &nbsp;&nbsp;

                    <input type="radio" name="radio">
                    Non

                </font>
            </td>
        </tr>

        <tr>
            <td align="right">
                <font size="5">climatisation :</font>
            </td>

            <td>
                <font size="5">

                    <input type="radio" name="clim">
                    Oui

                    &nbsp;&nbsp;

                    <input type="radio" name="clim">
                    Non

                </font>
            </td>
        </tr>

        <tr>
            <td></td>

            <td>
                <input
                    type="submit"
                    value="Enregistrer"
                >

                <br><br>

                <input
                    type="reset"
                    value="Annuler"
                > <br>
                <a href="../index.html">Retour</a>
            </td>
        </tr>

    </table>

</body>
</html>
