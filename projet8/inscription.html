<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Inscription nouveau client</title>
</head>

<body bgcolor="blue">

    <h1 align="center">
        <font color="yellow" size="7">
            Inscription nouveau client
        </font>
    </h1>

    <br><br>

    <table
        align="center"
        width="630"
        bgcolor="red"
        cellpadding="8"
        cellspacing="0"
        border="0"
    >

     
        <tr>
            <td width="250" align="right">
                <font size="5">Nom :</font>
            </td>

            <td>
                <input type="text" size="25">
            </td>
        </tr>

     
        <tr>
            <td align="right">
                <font size="5">Prénom :</font>
            </td>

            <td>
                <input type="text" size="25">
            </td>
        </tr>

       
        <tr>
            <td align="right">
                <font size="5">
                    Date de<br>
                    naissance :
                </font>
            </td>

            <td>
                <input type="date">
            </td>
        </tr>

        <tr>
            <td align="right">
                <font size="5">
                    Adresse<br>
                    mail :
                </font>
            </td>

            <td>
                <input type="email" size="25">
            </td>
        </tr>

       
        <tr>
            <td align="right">
                <font size="5">
                    Mots de<br>
                    passe :
                </font>
            </td>

            <td>
                <input type="password" size="25">
            </td>
        </tr>

 
        <tr>
            <td align="right">
                <font size="5">
                    Numéro de<br>
                    permis :
                </font>
            </td>

            <td>
                <input type="text" size="25">
            </td>
        </tr>

    
        <tr>
            <td align="right">
                <font size="5">
                    Nombre d'années<br>
                    d'ancienneté :
                </font>
            </td>

            <td>
                <input type="number" min="0" size="25">
            </td>
        </tr>


        <tr>
            <td align="right">
                <font size="5">Ville :</font>
            </td>

            <td>
                <select>
                    <option>Paris</option>
                    <option>Lyon</option>
                    <option>Marseille</option>
                    <option>Lille</option>
                    <option>Toulouse</option>
                    <option>Bordeaux</option>
                    <option>Nantes</option>
                </select>
            </td>
        </tr>

    
        <tr>
            <td align="right">
                <font size="5">
                    Adresse du<br>
                    client :
                </font>
            </td>

            <td>
                <textarea rows="5" cols="25"></textarea>
            </td>
        </tr>

        
        <tr>
            <td align="right">
                <font size="5">
                    Situation<br>
                    matrimoniale :
                </font>
            </td>

            <td>
                <font size="5">

                    <input type="radio" name="situation" value="marie">
                    Marié

                    <br>

                    <input type="radio" name="situation" value="non-marie">
                    Non marié

                </font>
            </td>
        </tr>

        
        <tr>
            <td align="right">
                <font size="5">
                    Préférence<br>
                    de voiture :
                </font>
            </td>

            <td>
                <font size="5">

                    <input
                        type="checkbox"
                        name="voiture"
                        value="automatique"
                    >
                    Automatique

                    <br>

                    <input
                        type="checkbox"
                        name="voiture"
                        value="manuelle"
                    >
                    Manuelle

                </font>
            </td>
        </tr>

    
        <tr>
            <td></td>

            <td>
                <input
                    type="submit"
                    value="Enregistrer"
                >

                <br><br>

                <input
                    type="reset"
                    value="Annuler"
                >

                <br><br>

                <a href="../index.html">Retour</a>
            </td>
        </tr>

    </table>

</body>
</html>
